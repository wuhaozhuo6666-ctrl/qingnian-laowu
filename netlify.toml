[build]
  ignore = "node ./netlify/ignore-build.mjs"
  command = "mkdir -p dist && cp index.html preview-elegant.html dist/ && cp -R products dist/ && mkdir -p dist/products/showroom && tr -d '\\n' < netlify/hero/park-final.txt | base64 -d > dist/products/showroom/home-hero.webp"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
